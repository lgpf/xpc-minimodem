<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#222">Modem WiFi XPC: plugue PS/2 macho &#8594; WeMos D1 mini</text>
  <text x="500" y="58" font-size="14" text-anchor="middle" fill="#555">Porta do mouse da TTGO VGA32 (Setup &gt; Mouse port = Auto ou Serial COM1) &#8212; 9600 8N1</text>

  <!-- ===== PS/2 plug (vista dos pinos do plugue macho) ===== -->
  <text x="190" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Plugue PS/2 MACHO</text>
  <text x="190" y="124" font-size="12" text-anchor="middle" fill="#555">(vista olhando para os pinos)</text>
  <circle cx="190" cy="250" r="105" fill="#d9d9d9" stroke="#333" stroke-width="3"/>
  <circle cx="190" cy="250" r="88" fill="#efefef" stroke="#777" stroke-width="1.5"/>
  <rect x="178" y="150" width="24" height="26" fill="#333"/>
  <!-- pins: male plug view: top 5 . 6 ; middle 3 4 ; bottom 1 2 -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="150" cy="200" r="11" fill="#c9a227" stroke="#333"/><text x="128" y="205" fill="#222">5</text>
    <circle cx="230" cy="200" r="11" fill="#c9a227" stroke="#333"/><text x="230" y="182" fill="#222">6</text>
    <circle cx="122" cy="255" r="11" fill="#c9a227" stroke="#333"/><text x="122" y="285" fill="#222">3</text>
    <circle cx="258" cy="255" r="11" fill="#c9a227" stroke="#333"/><text x="258" y="285" fill="#222">4</text>
    <circle cx="160" cy="305" r="11" fill="#c9a227" stroke="#333"/><text x="150" y="333" fill="#222">1</text>
    <circle cx="220" cy="305" r="11" fill="#c9a227" stroke="#333"/><text x="230" y="333" fill="#222">2</text>
  </g>

  <!-- PS/2 legend table -->
  <g font-size="13" fill="#222" transform="translate(345,-120)">
    <text x="40" y="395" font-weight="bold">Pino PS/2</text><text x="135" y="395" font-weight="bold">Sinal (porta da TTGO)</text>
    <rect x="35" y="403" width="12" height="12" fill="#d62728"/><text x="55" y="414">4</text><text x="135" y="414">+5V</text>
    <rect x="35" y="423" width="12" height="12" fill="#000"/><text x="55" y="434">3</text><text x="135" y="434">GND</text>
    <rect x="35" y="443" width="12" height="12" fill="#1f77b4"/><text x="55" y="454">5</text><text x="135" y="454">Clock = TX da TTGO (GPIO 26)</text>
    <rect x="35" y="463" width="12" height="12" fill="#2ca02c"/><text x="55" y="474">1</text><text x="135" y="474">Dados = RX da TTGO (GPIO 27)</text>
    <text x="55" y="494" fill="#777">2, 6</text><text x="135" y="494" fill="#777">nao usados</text>
  </g>

  <!-- ===== WeMos D1 mini (vista de cima, antena para cima) ===== -->
  <text x="790" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">WeMos D1 mini</text>
  <text x="790" y="124" font-size="12" text-anchor="middle" fill="#555">(vista de cima, antena para cima, USB embaixo)</text>
  <rect x="690" y="140" width="200" height="330" rx="10" fill="#1d5fa8" stroke="#123" stroke-width="2"/>
  <rect x="735" y="150" width="110" height="70" fill="#c8c8c8" stroke="#555"/>
  <text x="790" y="190" font-size="12" text-anchor="middle" fill="#333">ESP-12</text>
  <rect x="765" y="445" width="50" height="30" fill="#bbb" stroke="#555"/>
  <text x="790" y="465" font-size="10" text-anchor="middle" fill="#222">USB</text>
  <g font-size="12" fill="#fff">
    <!-- left column -->
    <g text-anchor="start">
      <text x="712" y="249">RST</text><text x="712" y="274">A0</text><text x="712" y="299">D0</text><text x="712" y="324">D5</text>
      <text x="712" y="349">D6</text><text x="712" y="374">D7</text><text x="712" y="399">D8</text><text x="712" y="424">3V3</text>
    </g>
    <!-- right column -->
    <g text-anchor="end">
      <text x="868" y="249" font-weight="bold">TX</text><text x="868" y="274" font-weight="bold">RX</text><text x="868" y="299">D1</text><text x="868" y="324">D2</text>
      <text x="868" y="349">D3</text><text x="868" y="374">D4</text><text x="868" y="399" font-weight="bold">G</text><text x="868" y="424" font-weight="bold">5V</text>
    </g>
  </g>
  <g fill="#e8e8e8" stroke="#333">
    <circle cx="700" cy="245" r="5"/><circle cx="700" cy="270" r="5"/><circle cx="700" cy="295" r="5"/><circle cx="700" cy="320" r="5"/>
    <circle cx="700" cy="345" r="5"/><circle cx="700" cy="370" r="5"/><circle cx="700" cy="395" r="5"/><circle cx="700" cy="420" r="5"/>
    <circle cx="880" cy="245" r="5"/><circle cx="880" cy="270" r="5"/><circle cx="880" cy="295" r="5"/><circle cx="880" cy="320" r="5"/>
    <circle cx="880" cy="345" r="5"/><circle cx="880" cy="370" r="5"/><circle cx="880" cy="395" r="5"/><circle cx="880" cy="420" r="5"/>
  </g>

  <!-- ===== wires (go around the right side of the board) ===== -->
  <!-- +5V : PS2 pin4 -> 5V -->
  <polyline points="269,255 330,255 330,560 950,560 950,420 885,420" fill="none" stroke="#d62728" stroke-width="4"/>
  <!-- GND : PS2 pin3 -> G -->
  <polyline points="111,255 70,255 70,580 965,580 965,395 885,395" fill="none" stroke="#000" stroke-width="4"/>
  <!-- TX TTGO (pin5) -> 1k -> RX WeMos -->
  <polyline points="150,189 150,160 480,160" fill="none" stroke="#1f77b4" stroke-width="4"/>
  <text x="420" y="182" font-size="13" text-anchor="middle" fill="#1f77b4" font-weight="bold">direto, SEM resistor</text>

  <polyline points="480,160 935,160 935,270 885,270" fill="none" stroke="#1f77b4" stroke-width="4"/>
  <!-- RX TTGO (pin1) <- 1k <- TX WeMos -->
  <polyline points="160,316 160,530 420,530" fill="none" stroke="#2ca02c" stroke-width="4"/>
  <rect x="420" y="520" width="60" height="20" fill="#f3e3c3" stroke="#2ca02c" stroke-width="2"/>
  <text x="450" y="535" font-size="12" text-anchor="middle" fill="#222">1k&#937;</text>
  <polyline points="480,530 920,530 920,245 885,245" fill="none" stroke="#2ca02c" stroke-width="4"/>

  <!-- wire labels -->
  <g font-size="12" font-weight="bold">
    <text x="500" y="150" fill="#1f77b4">TTGO TX (PS/2 5) &#8594; RX do WeMos</text>
    <text x="560" y="522" fill="#2ca02c">TTGO RX (PS/2 1) &#8592; TX do WeMos</text>
    <text x="560" y="553" fill="#d62728">+5V (PS/2 4) &#8594; 5V do WeMos</text>
    <text x="560" y="597" fill="#000">GND (PS/2 3) &#8594; G do WeMos</text>
  </g>

  <!-- LEDs opcionais -->
  <g font-size="11" fill="#222">
    <rect x="385" y="383" width="285" height="128" rx="6" fill="#fafafa" stroke="#999"/>
    <text x="395" y="398" font-size="12" font-weight="bold">LEDs opcionais (simulacro do modem original)</text>
    <text x="395" y="420">3V3</text>
    <line x1="420" y1="416" x2="440" y2="416" stroke="#555" stroke-width="2"/>
    <rect x="440" y="410" width="30" height="12" fill="#f3e3c3" stroke="#555"/><text x="455" y="420" text-anchor="middle" font-size="9">1k</text>
    <line x1="470" y1="416" x2="485" y2="416" stroke="#555" stroke-width="2"/>
    <polygon points="485,409 485,423 498,416" fill="#2ca02c" stroke="#333"/><line x1="498" y1="409" x2="498" y2="423" stroke="#333" stroke-width="2"/>
    <line x1="498" y1="416" x2="520" y2="416" stroke="#555" stroke-width="2"/>
    <text x="524" y="420" font-weight="bold">D2</text><text x="560" y="420">WiFi (DSR)</text>
    <text x="395" y="438">3V3</text>
    <line x1="420" y1="434" x2="440" y2="434" stroke="#555" stroke-width="2"/>
    <rect x="440" y="428" width="30" height="12" fill="#f3e3c3" stroke="#555"/><text x="455" y="438" text-anchor="middle" font-size="9">1k</text>
    <line x1="470" y1="434" x2="485" y2="434" stroke="#555" stroke-width="2"/>
    <polygon points="485,427 485,441 498,434" fill="#ff7f0e" stroke="#333"/><line x1="498" y1="427" x2="498" y2="441" stroke="#333" stroke-width="2"/>
    <line x1="498" y1="434" x2="520" y2="434" stroke="#555" stroke-width="2"/>
    <text x="524" y="438" font-weight="bold">D1</text><text x="560" y="438">Online (DCD)</text>
    <text x="395" y="456">3V3</text>
    <line x1="420" y1="452" x2="440" y2="452" stroke="#555" stroke-width="2"/>
    <rect x="440" y="446" width="30" height="12" fill="#f3e3c3" stroke="#555"/><text x="455" y="456" text-anchor="middle" font-size="9">1k</text>
    <line x1="470" y1="452" x2="485" y2="452" stroke="#555" stroke-width="2"/>
    <polygon points="485,445 485,459 498,452" fill="#9467bd" stroke="#333"/><line x1="498" y1="445" x2="498" y2="459" stroke="#333" stroke-width="2"/>
    <line x1="498" y1="452" x2="520" y2="452" stroke="#555" stroke-width="2"/>
    <text x="524" y="456" font-weight="bold">D6</text><text x="560" y="456">Ring (RI)</text>
    <text x="395" y="474">3V3</text>
    <line x1="420" y1="470" x2="440" y2="470" stroke="#555" stroke-width="2"/>
    <rect x="440" y="464" width="30" height="12" fill="#f3e3c3" stroke="#555"/><text x="455" y="474" text-anchor="middle" font-size="9">2k2</text>
    <line x1="470" y1="470" x2="485" y2="470" stroke="#555" stroke-width="2"/>
    <polygon points="485,463 485,477 498,470" fill="#1f77b4" stroke="#333"/><line x1="498" y1="463" x2="498" y2="477" stroke="#333" stroke-width="2"/>
    <line x1="498" y1="470" x2="520" y2="470" stroke="#555" stroke-width="2"/>
    <text x="524" y="474" font-weight="bold">RX</text><text x="560" y="474">TX dados (2k2)</text>
    <text x="395" y="492">3V3</text>
    <line x1="420" y1="488" x2="440" y2="488" stroke="#555" stroke-width="2"/>
    <rect x="440" y="482" width="30" height="12" fill="#f3e3c3" stroke="#555"/><text x="455" y="492" text-anchor="middle" font-size="9">2k2</text>
    <line x1="470" y1="488" x2="485" y2="488" stroke="#555" stroke-width="2"/>
    <polygon points="485,481 485,495 498,488" fill="#d62728" stroke="#333"/><line x1="498" y1="481" x2="498" y2="495" stroke="#333" stroke-width="2"/>
    <line x1="498" y1="488" x2="520" y2="488" stroke="#555" stroke-width="2"/>
    <text x="524" y="492" font-weight="bold">TX</text><text x="560" y="492">RX dados (2k2)</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#444">
    <text x="40" y="618">Use o cabo de um mouse PS/2 velho (confira as cores com multimetro). Fonte da TTGO: 5V 2A ou mais (picos de 300-400 mA no WiFi).</text>
    <text x="40" y="634">LED: perna maior (anodo) no lado do 3V3; os LEDs de dados piscam fraco (2k2 para nao carregar a serial). Nao use LED no D8.</text>
    <text x="40" y="650">Para gravar o WeMos pela USB dele, desligue-o da TTGO. Firmware: RetroWiFiModemXPC_d1mini.bin (0x0); depois AT&amp;F, configurar WiFi, AT&amp;W.</text>
  </g>

  <g font-size="13" fill="#222">
    <rect x="40" y="668" width="920" height="112" rx="6" fill="#fff8e6" stroke="#c90"/>
    <text x="55" y="688" font-weight="bold" font-size="14">Componentes OBRIGATORIOS (soldar junto do WeMos)</text>
    <text x="55" y="708">&#8226; 1 resistor de 1k&#937; so na linha VERDE (PS/2 pino 1 &#8592; TX do WeMos). Linha AZUL (pino 5 &#8594; RX) direta, SEM resistor.</text>
    <text x="55" y="726">&#8226; Capacitor eletrolitico 470&#181;F / 10V ou mais entre 5V e G (faixa "&#8211;" no G): segura os picos do WiFi.</text>
    <text x="55" y="744">&#8226; Capacitor 10&#181;F (ceramico "106" ou eletrolitico com "&#8211;" no G) entre RST e G: partida limpa junto com a TTGO.</text>
    <text x="55" y="766" fill="#555">&#8226; Opcional (som): disco piezo 27 mm entre D5 e G (sem polaridade). Ativa com ATM1 + AT&amp;W.</text>
  </g>
</svg>